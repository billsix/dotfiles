set -g mouse on

set-option -g status-bg blue
set-option -g status-fg white
set-option -g status-left "{#(whoami)@#H}"
set-option -g status-left-length 40
# The active pane's running command, then the full title it set, if any
# (e.g. emerge's progress).
set-option -g status-right "#{pane_current_command}: #{pane_title}  %H:%M %d-%b-%y"
set-option -g status-right-length 200

set-option -g prefix C-t
# C-t C-t sends C-t to the pane: Emacs's transpose-chars, or the prefix of a
# tmux nested inside (a container's tmux under the host's).
bind C-t send-prefix
# New panes and windows start in the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Meta keys arrive as Esc + key; a short wait keeps M-x snappy in emacs -nw
# (older tmux waited 500 ms).
set -sg escape-time 10
# Tell Emacs when its pane gains or loses focus (it rechecks changed files).
set -g focus-events on

# tmux's own terminal type, and 24-bit colour from the outer terminal.
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB,xterm-256color:RGB"

# Programs inside tmux may set the system clipboard (OSC 52).
set -g set-clipboard on

# The terminal window title: user@host and the running command.
set -g set-titles on
set -g set-titles-string "#{user}@#H: #{pane_current_command}"

set-option -g base-index 1
set-window-option -g pane-base-index 1

set-option -g history-limit 50000

set -g pane-border-status top
set -g pane-border-format "#P: #{pane_current_command}"

# Hide everything except pane number for inactive panes
set -g window-status-format "#I"

# Customize the active pane display
set -g window-status-current-format "#I"
set -g window-status-current-style fg=white,bg=black,bold

set-option -g renumber-windows on
